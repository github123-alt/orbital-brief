[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-brief"
version = "1.0.0"
description = "AI-powered space operations briefing — live NASA, JPL, CelesTrak & IBM watsonx.ai."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "ibm-watsonx-ai>=1.0",
]

[project.scripts]
orbital-brief = "briefing:main"
ask-flight-director = "ask:main_cli"

[project.urls]
Homepage = "https://github.com/your-username/orbital-brief"
"Bug Tracker" = "https://github.com/your-username/orbital-brief/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["briefing*", "nasa_api*", "significance*", "mission_planner*", "spacecraft_health*", "watsonx*", "ask*"]
